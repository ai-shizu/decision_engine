name: build-macos

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, macOS, ARM64, pkb-release]
            target: aarch64-apple-darwin
          - runner: [self-hosted, macOS, X64, pkb-release]
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      LC_ALL: C
      TZ: UTC
      PYTHONHASHSEED: "0"
      PKB_PYTHON: python3.12
      PKB_RELEASE_ASSET_ROOT: ${{ vars.PKB_RELEASE_ASSET_ROOT }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Verify pinned release toolchain
        run: |
          test "$(python3.12 --version)" = "Python 3.12.10"
          test "$(node --version)" = "v24.18.0"
          rustc --version | grep -q '^rustc 1\.96\.1 '
          rustup target list --installed | grep -qx '${{ matrix.target }}'
          test -n "$PKB_RELEASE_ASSET_ROOT"
          test -d "$PKB_RELEASE_ASSET_ROOT/models"
          test -d "$PKB_RELEASE_ASSET_ROOT/tools/llama-arm64"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Verify runner architecture
        run: |
          case "${{ matrix.target }}" in
            aarch64-*) test "$(uname -m)" = "arm64" ;;
            x86_64-*) test "$(uname -m)" = "x86_64" ;;
          esac

      - name: Build native search engine
        run: bash build.sh --skip-py

      - name: Build hash-locked Python sidecar
        run: |
          test -f apps/desktop/src-tauri/sidecar-entitlements.plist
          bash apps/desktop/scripts/build-sidecar.sh

      - name: Reproducibility comparison for unsigned inputs
        run: |
          BIN="apps/desktop/src-tauri/binaries/pkb-engine-${{ matrix.target }}"
          FIRST="$RUNNER_TEMP/pkb-engine-first-${{ matrix.target }}"
          cp "$BIN" "$FIRST"
          bash apps/desktop/scripts/build-sidecar.sh
          cmp "$FIRST" "$BIN"
          file "$BIN"
          case "${{ matrix.target }}" in
            aarch64-*) file "$BIN" | grep -q "arm64" ;;
            x86_64-*) file "$BIN" | grep -q "x86_64" ;;
          esac

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts

      - name: Cache locked Rust dependencies for offline build
        working-directory: apps/desktop/src-tauri
        run: cargo fetch --locked --target ${{ matrix.target }}

      - name: Build signed Tauri application
        working-directory: apps/desktop
        env:
          CARGO_NET_OFFLINE: "true"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx --no-install tauri build --target ${{ matrix.target }}

      - name: Verify App Sandbox and final embedded sidecar
        run: |
          APP="$(find "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$APP"
          APP="$(cd "$APP" && pwd)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          APP_ENTITLEMENTS="$(codesign -d --entitlements :- "$APP" 2>&1)"
          printf '%s\n' "$APP_ENTITLEMENTS" | grep -q 'com.apple.security.app-sandbox'
          if printf '%s\n' "$APP_ENTITLEMENTS" | grep -q 'com.apple.security.network.client'; then exit 1; fi
          if printf '%s\n' "$APP_ENTITLEMENTS" | grep -q 'com.apple.security.network.server'; then exit 1; fi
          SIDECAR="$(find "$APP/Contents" -type f -name 'pkb-engine-*' -print -quit)"
          test -n "$SIDECAR"
          codesign --verify --strict --verbose=2 "$SIDECAR"
          SIDECAR_ENTITLEMENTS="$(codesign -d --entitlements :- "$SIDECAR" 2>&1)"
          printf '%s\n' "$SIDECAR_ENTITLEMENTS" | grep -q 'com.apple.security.app-sandbox'
          printf '%s\n' "$SIDECAR_ENTITLEMENTS" | grep -q 'com.apple.security.inherit'
          if printf '%s\n' "$SIDECAR_ENTITLEMENTS" | grep -q 'com.apple.security.network.client'; then exit 1; fi
          if printf '%s\n' "$SIDECAR_ENTITLEMENTS" | grep -q 'com.apple.security.network.server'; then exit 1; fi
          echo PKB_MACOS_SANDBOX_VERIFIED
          printf 'PKB_APP=%s\nPKB_FINAL_SIDECAR=%s\n' "$APP" "$SIDECAR" >> "$GITHUB_ENV"

      - name: Assemble offline production artifact pack
        run: |
          RELEASE_ROOT="$RUNNER_TEMP/pkb-release-${{ matrix.target }}"
          RELEASE_DATA="$RELEASE_ROOT/data"
          mkdir -p "$RELEASE_DATA/models" "$RELEASE_DATA/tools" "$RELEASE_DATA/build" "$RELEASE_DATA/config" "$RELEASE_DATA/sbom"
          ditto "$PKB_RELEASE_ASSET_ROOT/models" "$RELEASE_DATA/models"
          ditto "$PKB_RELEASE_ASSET_ROOT/tools/llama-arm64" "$RELEASE_DATA/tools/llama-arm64"
          cp build/search_engine "$RELEASE_DATA/build/search_engine"
          cp config/model_params.json "$RELEASE_DATA/config/model_params.json"
          printf 'PKB_RELEASE_ROOT=%s\nPKB_RELEASE_DATA=%s\n' "$RELEASE_ROOT" "$RELEASE_DATA" >> "$GITHUB_ENV"

      - name: Generate deterministic SBOM
        run: |
          python3.12 scripts/generate_release_sbom.py --root . --output "$PKB_RELEASE_DATA/sbom/release.cdx.json"
          python3.12 scripts/generate_release_sbom.py --root . --output "$RUNNER_TEMP/release-second.cdx.json"
          cmp "$PKB_RELEASE_DATA/sbom/release.cdx.json" "$RUNNER_TEMP/release-second.cdx.json"

      - name: Sign canonical artifact allowlist
        working-directory: apps/desktop/src-tauri
        env:
          PKB_ARTIFACT_SIGNING_KEY: ${{ secrets.PKB_ARTIFACT_SIGNING_KEY }}
        run: |
          cargo run --locked --release --bin pkb-artifact-manifest -- \
            --app-root "$(dirname "$PKB_FINAL_SIDECAR")" \
            --data-root "$PKB_RELEASE_DATA" \
            --plan ../artifact-plan.production.json \
            --manifest "$PKB_RELEASE_DATA/config/artifacts_allowlist.json" \
            --signature "$PKB_RELEASE_DATA/config/artifacts_allowlist.sig" \
            --target "${{ matrix.target }}"

      - name: Package signed artifact inventory and SBOM
        run: |
          shasum -a 256 "$PKB_FINAL_SIDECAR" build/search_engine "$PKB_RELEASE_DATA/config/artifacts_allowlist.json" "$PKB_RELEASE_DATA/config/artifacts_allowlist.sig" > "$PKB_RELEASE_ROOT/SBOM-SHA256SUMS"
          tar -C "$PKB_RELEASE_ROOT" -czf "pkb-artifact-pack-${{ matrix.target }}.tar.gz" data SBOM-SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pkb-macos-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            pkb-artifact-pack-${{ matrix.target }}.tar.gz
          if-no-files-found: error
