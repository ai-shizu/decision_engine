# T4-D — iOS config / static contract gate (PR lane).
#
# Measures regenerable canonical iOS config + FORCE_COLOR matrix + full
# gen/apple manifest. Does NOT measure signing / Archive/IPA / real GGUF /
# physical-device HMR. PUBLIC repo: GitHub-hosted macOS only.
name: ios-config-gate

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-config-contract:
    name: iOS config contract
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install frontend deps (lockfile; Tauri CLI) BEFORE npx tauri
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx --no-install tauri --version

      - name: Pin XcodeGen exact version
        run: |
          set -euo pipefail
          EXPECTED="$(python3 -c 'import json;print(json.load(open("apps/desktop/src-tauri/ios/policy/ios-release.policy.json"))["xcodegen_version"])')"
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          GOT="$(xcodegen --version | awk '{print $2}')"
          echo "xcodegen got=$GOT expected=$EXPECTED"
          test "$GOT" = "$EXPECTED"

      - name: iOS config contract gate (FORCE_COLOR unset)
        env:
          T4D_LOG_DIR: ${{ runner.temp }}/t4d-logs
        run: |
          set -euo pipefail
          mkdir -p "$T4D_LOG_DIR"
          chmod +x scripts/ios_*.sh scripts/ios/*.py scripts/ios/*.sh 2>/dev/null || true
          env -u FORCE_COLOR -u NO_COLOR -u CLICOLOR -u CLICOLOR_FORCE \
            bash scripts/ios_config_contract_gate.sh
          echo "SIGNING: NOT MEASURED"
          echo "ARCHIVE/IPA: NOT MEASURED"
          echo "REAL GGUF THREE-POINT: NOT MEASURED"
          echo "PHYSICAL-DEVICE HMR: NOT MEASURED"

      - name: Upload config receipts (no secrets / no IPA / no GGUF)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-config-contract-receipts
          path: |
            ${{ runner.temp }}/t4d-logs/**
          if-no-files-found: error

  ios-rust-lib-check-sim:
    name: iOS Rust lib check (sim)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Create NOTGGUF placeholder (Rust-only check — NOT real GGUF)
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/apps/desktop/models"
          printf 'NOTGGUF\n' > "$GITHUB_WORKSPACE/apps/desktop/models/pocket-brain.gguf"
          echo "REAL GGUF THREE-POINT: NOT MEASURED"
          echo "NOTE: this job is Rust lib cargo check only — not an Xcode simulator app build"

      - name: Install Rust iOS simulator target
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios-sim
          rustup target list --installed | grep -qx aarch64-apple-ios-sim

      - name: cargo check aarch64-apple-ios-sim (pocket-brain,secure-vault,flavor-live)
        working-directory: apps/desktop/src-tauri
        run: |
          set -euo pipefail
          cargo check \
            --target aarch64-apple-ios-sim \
            --features pocket-brain,secure-vault,flavor-live \
            --lib
          echo "SIGNING: NOT MEASURED"
          echo "ARCHIVE/IPA: NOT MEASURED"
          echo "REAL GGUF THREE-POINT: NOT MEASURED"
          echo "PHYSICAL-DEVICE HMR: NOT MEASURED"

  # D-3: prove ios_archive_scan.sh is reachable from CI without a signing identity.
  # Fixtures only; ios_archive_scan.sh / gguf_three_point_sha_gate.sh unmodified.
  archive-scan-wiring:
    name: archive-scan-wiring
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Fixture RED/GREEN matrix for ios_archive_scan.sh (T4B_ONLY)
        run: |
          set -euo pipefail
          chmod +x scripts/ios_archive_scan.sh scripts/ios_archive_scan_wiring.sh \
            scripts/gguf_three_point_sha_gate.sh
          bash scripts/ios_archive_scan_wiring.sh
