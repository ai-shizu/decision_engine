name: pkb-desktop
options:
  bundleIdPrefix: com.ai-shizu.pkb
  deploymentTarget:
    iOS: 17.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Coraxis
      PRODUCT_BUNDLE_IDENTIFIER: com.ai-shizu.pkb
      # Xcode 26 default script sandboxing blocks tauri ios xcode-script from
      # reading project.pbxproj. Keep disabled (canonical; not a gen hand-edit).
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      # iPhone only — never "1,2". Policy: targeted_device_family=1.
      TARGETED_DEVICE_FAMILY: "1"
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  pkb-desktop_iOS:
    type: application
    platform: iOS
    # Force PBX productReference / scheme BuildableName = Coraxis.app
    productName: Coraxis
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: pkb-desktop_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
      # Canonical PrivacyInfo is synced to gen/apple/PrivacyInfo.xcprivacy before
      # xcodegen. Membership is this exact root-relative path (no nested fallback).
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: pkb-desktop_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "1"
        # Canonical Info.ios.plist keys — also re-merged deterministically after init.
        NSFaceIDUsageDescription: Vaultの自動解錠および、機密性の高いプロンプトデータの保護にFace IDを使用します。
        NSCalendarsFullAccessUsageDescription: Coraxisのコンテキストに予定を取り込むため、カレンダーへのフルアクセスを使用します。
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: pkb-desktop_iOS/pkb-desktop_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        PRODUCT_NAME: Coraxis
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        TARGETED_DEVICE_FAMILY: "1"
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: Accelerate.framework
      - sdk: LocalAuthentication.framework
      - sdk: WebKit.framework
    preBuildScripts:
      # ${FORCE_COLOR} is a sentinel: XcodeGen expands ambient ${FORCE_COLOR}
      # into a bare 0/1 positional arg. Post-init replaces the sentinel with the
      # literal ${FORCE_COLOR} so build-time shell expansion remains correct.
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a