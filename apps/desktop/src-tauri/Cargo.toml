[package]
name = "pkb-desktop"
version = "0.1.0"
description = "Coraxis — offline decision support desktop app"
authors = ["ai-shizu"]
edition = "2021"
default-run = "pkb-desktop"

[lib]
name = "pkb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros", "rt", "sync"] }
base64 = "=0.22.1"
ed25519-dalek = "=3.0.0"
sha2 = "=0.11.0"
zeroize = "=1.9.0"
hmac = "=0.13.0"
unicode-normalization = "=0.1.24"
caseless = "=0.2.1"
aho-corasick = "=1.1.3"
hex = "=0.4.3"
subtle = "=2.6.1"
# STEP 5.A (feature-isolated): base build carries NO TLS provider at all, so the
# toolchain-heavy aws-lc-sys/ring C builds are never triggered by a plain
# `cargo build`/`cargo test`. TLS only enters via the opt-in `egress-live`
# feature below (§1.4 blueprint update). Never add gzip/brotli/deflate/
# native-tls/default-tls/socks/cookies here or under egress-live.
reqwest = { version = "=0.13.4", default-features = false, features = ["stream"] }
hickory-resolver = { version = "=0.25.2", default-features = false, features = ["tokio", "system-config"], optional = true }
# egress-live TLS: rustls+ring only (native-tls/aws-lc forbidden per STEP 7).
rustls = { version = "=0.23.41", default-features = false, features = ["ring", "std", "tls12"], optional = true }
hyper-rustls = { version = "=0.27.9", default-features = false, features = ["http1", "ring", "tls12", "logging"], optional = true }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12", "logging"], optional = true }

# M4 on-device LLM (docs/architecture_blueprint.md §3.1). Gated behind the
# `pocket-brain` feature so the default desktop build never pulls the cmake/C++
# toolchain and stays byte-identical to main. `metal` drives -DGGML_METAL=ON.
# `common` (M5) compiles llama.cpp's common C++ library — required because
# LlamaSampler::grammar/grammar_lazy are #[cfg(feature = "common")] in 0.1.151.
llama-cpp-2 = { version = "=0.1.151", default-features = false, features = ["metal", "common"], optional = true }

# M3 SQLCipher vault (docs/m3_action_plan.md §2.1). Opt-in only — default desktop
# builds must not pull SQLCipher. `bundled-sqlcipher` uses Apple CommonCrypto on
# iOS/macOS; NEVER enable `bundled-sqlcipher-vendored-openssl` (OpenSSL link ban).
# `auto_extension` is available without `load_extension` (dylib); M9 registers
# sqlite-vec via static `sqlite3_auto_extension` so iOS never needs a .dylib.
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled-sqlcipher"], optional = true }
# M9 local RAG: sqlite-vec C sources compiled + statically linked at build time
# (`SQLITE_CORE`). Never `load_extension` / never ship a separate vec dylib.
sqlite-vec = { version = "=0.1.9", optional = true }

[features]
# NOTE: the blueprint prose says "reqwest/rustls-tls"; reqwest 0.13.4's actual
# feature name is "rustls" (verified via `cargo add --dry-run` feature listing
# during STEP 5.A). Adapted to crate reality — still rustls-only, no native-tls.
# Use rustls-no-provider + explicit ring deps (aws-lc-sys toolchain blocker on ARM64).
egress-live = ["dep:hickory-resolver", "dep:rustls", "dep:hyper-rustls", "dep:tokio-rustls", "reqwest/rustls-no-provider"]
# M4 on-device LLM scaffold. Enables the optional llama-cpp-2 dep (requires cmake
# + C++ toolchain). Never enable on default/release desktop builds.
pocket-brain = ["llama-cpp-2", "libc", "dep:rfd"]
# M3 Phase 0+: SQLCipher + typed objc2 Keychain link gate. Keep off default
# builds. All Apple bindings live in one objc2 type system; do not reintroduce
# security-framework alongside them (docs/m3_action_plan.md §4.2.1).
secure-vault = [
    "dep:rusqlite",
    "dep:sqlite-vec",
    "dep:objc2",
    "dep:objc2-security",
    "dep:objc2-local-authentication",
    "dep:objc2-foundation",
    "dep:objc2-core-foundation",
    "dep:objc2-ui-kit",
    "dep:objc2-vision",
]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Offline model setup gate: native local GGUF picker (desktop only; never network).
# Optional + enabled by `pocket-brain`. Absent on iOS (inject / Files path).
[target.'cfg(not(target_os = "ios"))'.dependencies]
rfd = { version = "=0.15.4", optional = true }

# M4 pocket-brain jetsam probe (proc_pid_rusage). Optional; only pulled by the
# `pocket-brain` feature so the default desktop build is unaffected.
# M3 Keychain: exact-pin typed objc2 stack, Apple-only and secure-vault-only
# (docs/m3_action_plan.md §4.2.1).
[target.'cfg(target_vendor = "apple")'.dependencies]
libc = { version = "0.2", optional = true }
objc2 = { version = "=0.6.4", default-features = false, features = ["std"], optional = true }
objc2-security = { version = "=0.3.2", default-features = false, features = ["std", "objc2", "SecAccessControl", "SecBase", "SecItem", "SecRandom"], optional = true }
objc2-local-authentication = { version = "=0.3.2", default-features = false, features = ["std", "LAContext"], optional = true }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSDictionary", "NSObject", "NSValue", "NSNotification", "NSData", "NSArray", "objc2-core-foundation"], optional = true }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["alloc", "CFData", "CFDictionary", "CFError", "objc2"], optional = true }
objc2-vision = { version = "=0.3.2", default-features = false, features = [
    "std",
    "VNRecognizeTextRequest",
    "VNRequest",
    "VNObservation",
    "VNRequestHandler",
    "block2",
    "objc2-core-foundation",
], optional = true }

# M3 Phase 4-A background auto-lock: UIKit lifecycle notification constants.
# iOS-only because UIKit does not exist on macOS; already compiled in the graph
# via tao/tauri, so this exact pin adds no new build (docs/m3_action_plan.md §0).
[target.'cfg(target_os = "ios")'.dependencies]
# Phase 10: UIFeedbackGenerator* for Taptic Engine (haptics.rs).
objc2-ui-kit = { version = "=0.3.2", default-features = false, features = [
    "std",
    "UIApplication",
    "UIFeedbackGenerator",
    "UIImpactFeedbackGenerator",
    "UISelectionFeedbackGenerator",
    "UINotificationFeedbackGenerator",
], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt", "time"] }
