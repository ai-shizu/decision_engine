[package]
name = "pkb-desktop"
version = "0.1.0"
description = "PKB — Personal Knowledge Base desktop app"
authors = ["ai-shizu"]
edition = "2021"
default-run = "pkb-desktop"

[lib]
name = "pkb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros", "rt", "sync"] }
base64 = "=0.22.1"
ed25519-dalek = "=3.0.0"
sha2 = "=0.11.0"
zeroize = "=1.9.0"
hmac = "=0.13.0"
unicode-normalization = "=0.1.24"
caseless = "=0.2.1"
aho-corasick = "=1.1.3"
hex = "=0.4.3"
subtle = "=2.6.1"
# STEP 5.A (feature-isolated): base build carries NO TLS provider at all, so the
# toolchain-heavy aws-lc-sys/ring C builds are never triggered by a plain
# `cargo build`/`cargo test`. TLS only enters via the opt-in `egress-live`
# feature below (§1.4 blueprint update). Never add gzip/brotli/deflate/
# native-tls/default-tls/socks/cookies here or under egress-live.
reqwest = { version = "=0.13.4", default-features = false, features = ["stream"] }
hickory-resolver = { version = "=0.25.2", default-features = false, features = ["tokio", "system-config"], optional = true }
# egress-live TLS: rustls+ring only (native-tls/aws-lc forbidden per STEP 7).
rustls = { version = "=0.23.41", default-features = false, features = ["ring", "std", "tls12"], optional = true }
hyper-rustls = { version = "=0.27.9", default-features = false, features = ["http1", "ring", "tls12", "logging"], optional = true }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12", "logging"], optional = true }

# M4 on-device LLM (docs/architecture_blueprint.md §3.1). Gated behind the
# `pocket-brain` feature so the default desktop build never pulls the cmake/C++
# toolchain and stays byte-identical to main. `metal` drives -DGGML_METAL=ON.
llama-cpp-2 = { version = "=0.1.151", default-features = false, features = ["metal"], optional = true }

[features]
# NOTE: the blueprint prose says "reqwest/rustls-tls"; reqwest 0.13.4's actual
# feature name is "rustls" (verified via `cargo add --dry-run` feature listing
# during STEP 5.A). Adapted to crate reality — still rustls-only, no native-tls.
# Use rustls-no-provider + explicit ring deps (aws-lc-sys toolchain blocker on ARM64).
egress-live = ["dep:hickory-resolver", "dep:rustls", "dep:hyper-rustls", "dep:tokio-rustls", "reqwest/rustls-no-provider"]
# M4 on-device LLM scaffold. Enables the optional llama-cpp-2 dep (requires cmake
# + C++ toolchain). Never enable on default/release desktop builds.
pocket-brain = ["llama-cpp-2"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt", "time"] }
