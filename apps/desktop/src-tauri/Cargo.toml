[package]
name = "pkb-desktop"
version = "0.1.0"
description = "PKB — Personal Knowledge Base desktop app"
authors = ["ai-shizu"]
edition = "2021"

[lib]
name = "pkb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
